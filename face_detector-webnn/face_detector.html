class WeightsFile {
  constructor(buffer, manifest) {
    this.buffer = buffer;
    this.manifest = manifest;
  }

  static async load(weightsPath, manifestPath) {
    const [wRes, mRes] = await Promise.all([fetch(weightsPath), fetch(manifestPath)]);
    if (!wRes.ok) throw new Error('Failed to load weights: ' + wRes.statusText);
    if (!mRes.ok) throw new Error('Failed to load manifest: ' + mRes.statusText);
    const buffer = await wRes.arrayBuffer();
    const manifest = await mRes.json();
    if (manifest.format !== 'wg-weights-manifest') throw new Error('Invalid manifest format');
    const magic = new TextDecoder().decode(new Uint8Array(buffer, 0, 4));
    if (magic !== 'WGWT') throw new Error('Invalid weights file');
    return new WeightsFile(buffer, manifest);
  }

  getSlice(name) {
    const t = this.manifest.tensors[name];
    if (!t) throw new Error('Tensor not found: ' + name);
    return t;
  }

  getData(name) {
    const t = this.getSlice(name);
    return this.buffer.slice(t.byteOffset, t.byteOffset + t.byteLength);
  }
}

async function main(deviceType = 'cpu') {
  if (!navigator.ml) throw new Error('WebNN is not supported in this browser.');
  const context = await navigator.ml.createContext({ deviceType });
  const weights = await WeightsFile.load('face_detector.weights', 'face_detector.manifest.json');
  const buildStart = performance.now();
  const graph = await buildGraph(context, weights);
  console.log(`Graph build: ${(performance.now() - buildStart).toFixed(2)}ms on ${deviceType.toUpperCase()}`)

  // Create input tensors
  const inputData_input = new Float32Array(49152); // [1,128,128,3]
  const inputTensor_input = await context.createTensor({ dataType: 'float32', shape: [1,128,128,3], writable: true });
  context.writeTensor(inputTensor_input, inputData_input);

  // Create output tensors — use actual shapes from built graph
  const outputTensor_regressors = await context.createTensor({ dataType: 'float32', shape: graph.outputShapes['regressors'], readable: true });
  const outputTensor_classificators = await context.createTensor({ dataType: 'float32', shape: graph.outputShapes['classificators'], readable: true });

  const inputs = {
    'input': inputTensor_input,
  };
  const outputs = {
    'regressors': outputTensor_regressors,
    'classificators': outputTensor_classificators,
  };

  const start = performance.now();
  context.dispatch(graph.graph, inputs, outputs);

  // Read results
  const result_regressors = new Float32Array(await context.readTensor(outputTensor_regressors));
  const result_classificators = new Float32Array(await context.readTensor(outputTensor_classificators));
  console.log(`Inference: ${(performance.now() - start).toFixed(2)}ms (1 run) on ${deviceType.toUpperCase()}`)

  // Benchmark: 50 runs
  const NUM_RUNS = 5;
  const runTimes = [];
  for (let i = 0; i < NUM_RUNS; i++) {
    const t0 = performance.now();
    context.dispatch(graph.graph, inputs, outputs);
    new Float32Array(await context.readTensor(outputTensor_regressors));
    new Float32Array(await context.readTensor(outputTensor_classificators));
    runTimes.push(performance.now() - t0);
  }
  const avgTime = (runTimes.reduce((a, b) => a + b, 0) / NUM_RUNS).toFixed(2);
  const sorted = [...runTimes].sort((a, b) => a - b);
  const medianTime = (NUM_RUNS % 2 ? sorted[NUM_RUNS >> 1] : (sorted[NUM_RUNS / 2 - 1] + sorted[NUM_RUNS / 2]) / 2).toFixed(2);
  console.log(`Inference: ${avgTime}ms (average \u00b7 ${NUM_RUNS} runs) on ${deviceType.toUpperCase()}`)
  console.log(`Inference: ${medianTime}ms (median \u00b7 ${NUM_RUNS} runs) on ${deviceType.toUpperCase()}`)

  return { 'regressors': result_regressors, 'classificators': result_classificators };
}

// ---- Harness ----
const INPUT_INFO = [
    { name: 'input', dataType: 'float32', shape: [1,128,128,3], TypedArray: Float32Array, size: 49152 },
];
const OUTPUT_INFO = [
    { name: 'regressors', dataType: 'float32', shape: [1,896,16], TypedArray: Float32Array, size: 14336 },
    { name: 'classificators', dataType: 'float32', shape: [1,896,1], TypedArray: Float32Array, size: 896 },
];

async function run() {
  const statusEl = document.getElementById('status');
  const runBtn = document.getElementById('runBtn');
  const resultsCard = document.getElementById('resultsCard');
  const resultsEl = document.getElementById('results');
  const deviceType = document.getElementById('device').value;

  try {
    runBtn.disabled = true;
    statusEl.className = 'status info';
    statusEl.textContent = 'Checking WebNN support...';

    if (!navigator.ml) {
      throw new Error('WebNN is not supported in this browser. Try Chrome 147+ with WebNN flags enabled.');
    }

    statusEl.textContent = 'Creating context (' + deviceType + ')...';
    const context = await navigator.ml.createContext({ deviceType });

    statusEl.textContent = 'Loading weights...';
    const weights = await WeightsFile.load('face_detector.weights', 'face_detector.manifest.json');

    statusEl.textContent = 'Building graph...';
    const buildStart = performance.now();
    const graph = await buildGraph(context, weights);
    const buildElapsed = (performance.now() - buildStart).toFixed(2);
    console.log('Graph build: ' + buildElapsed + 'ms on ' + deviceType.toUpperCase());

    // Create input tensors
    const inputs = {};
    for (const info of INPUT_INFO) {
      const data = new info.TypedArray(info.size);
      const isBigInt = info.dataType === 'int64' || info.dataType === 'uint64';
      for (let i = 0; i < data.length; i++) data[i] = isBigInt ? BigInt(Math.floor(Math.random() * 100)) : Math.random() * 2 - 1;
      const tensor = await context.createTensor({
        dataType: info.dataType, shape: info.shape.map(d => typeof d === 'number' ? d : 1),
        writable: true
      });
      context.writeTensor(tensor, data);
      inputs[info.name] = tensor;
    }

    // Create output tensors — use actual shapes from built graph
    const outputs = {};
    for (const info of OUTPUT_INFO) {
      outputs[info.name] = await context.createTensor({
        dataType: info.dataType, shape: graph.outputShapes[info.name],
        readable: true
      });
    }

    statusEl.textContent = 'Running inference...';
    const t0 = performance.now();
    context.dispatch(graph.graph, inputs, outputs);

    // Read results
    const results = {};
    for (const info of OUTPUT_INFO) {
      const buf = await context.readTensor(outputs[info.name]);
      results[info.name] = new info.TypedArray(buf);
    }
    const elapsed = (performance.now() - t0).toFixed(2);

    // Benchmark: 50 runs
    const NUM_RUNS = 5;
    const runTimes = [];
    for (let i = 0; i < NUM_RUNS; i++) {
      const t0b = performance.now();
      context.dispatch(graph.graph, inputs, outputs);
      for (const info of OUTPUT_INFO) {
        await context.readTensor(outputs[info.name]);
      }
      runTimes.push(performance.now() - t0b);
    }
    const avgTime = (runTimes.reduce((a, b) => a + b, 0) / NUM_RUNS).toFixed(2);
    const sorted = [...runTimes].sort((a, b) => a - b);
    const medianTime = (NUM_RUNS % 2 ? sorted[NUM_RUNS >> 1] : (sorted[NUM_RUNS / 2 - 1] + sorted[NUM_RUNS / 2]) / 2).toFixed(2);
    console.log('Inference: ' + avgTime + 'ms (average · ' + NUM_RUNS + ' runs) on ' + deviceType.toUpperCase());
    console.log('Inference: ' + medianTime + 'ms (median · ' + NUM_RUNS + ' runs) on ' + deviceType.toUpperCase());

    statusEl.className = 'status success';
    statusEl.style.whiteSpace = 'pre-line';
    statusEl.textContent = 'Graph build: ' + buildElapsed + 'ms on ' + deviceType.toUpperCase()
      + '\nInference: ' + elapsed + 'ms (1 run) on ' + deviceType.toUpperCase()
      + '\nInference: ' + avgTime + 'ms (average \u00b7 ' + NUM_RUNS + ' runs) on ' + deviceType.toUpperCase()
      + '\nInference: ' + medianTime + 'ms (median \u00b7 ' + NUM_RUNS + ' runs) on ' + deviceType.toUpperCase();

    // Show results
    resultsCard.style.display = '';
    let html = '';
    for (const info of OUTPUT_INFO) {
      const data = results[info.name];
      const preview = Array.from(data.slice(0, 10)).map(v => typeof v === 'bigint' ? v.toString() : Number(v).toFixed(6)).join(', ');
      html += '<div>' + info.name + ' ' + JSON.stringify(info.shape) + ' (' + info.dataType + ')</div>';
      html += '<pre>[' + preview + (data.length > 10 ? ', ...' : '') + ']</pre>';
    }
    resultsEl.innerHTML = html;

  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = 'Error: ' + err.message;
    console.error(err);
  } finally {
    runBtn.disabled = false;
  }
}
