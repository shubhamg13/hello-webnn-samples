<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebNN — Erase People (Instance Segmentation)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui,-apple-system,sans-serif; background:#f5f5f5; color:#1a1a1a; padding:1.5rem; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size:1.4rem; margin-bottom:.25rem; }
    .subtitle { color:#666; font-size:.85rem; margin-bottom:1rem; }
    .card { background:#fff; border-radius:6px; padding:1rem 1.25rem; margin-bottom:.75rem; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .controls { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
    label { font-weight:600; font-size:.85rem; }
    select,button,input[type=color] { padding:.3rem .75rem; border:1px solid #ddd; border-radius:4px; font-size:.85rem; cursor:pointer; }
    button { background:rgba(0,47,167,1); color:#fff; border:none; font-weight:500; }
    button:hover { background:rgba(0,47,167,.85); }
    button:disabled { background:#ccc; cursor:not-allowed; }
    .status { padding:.6rem 1rem; font-size:.85rem; border-radius:4px; margin-bottom:.75rem; }
    .status.info { background:#e3f2fd; border-left:3px solid #2196F3; }
    .status.success { background:#e9f8f0; border-left:3px solid #068906; }
    .status.error { background:#ffebee; border-left:3px solid #f44336; }
    .image-row { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; align-items:flex-start; }
    .image-col { flex:1; min-width:280px; max-width:520px; text-align:center; }
    .image-col img,.image-col canvas { max-width:100%; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.1); display:block; }
    .image-col h4 { font-size:.8rem; color:#666; margin-bottom:.3rem; }
  </style>
</head>
<body>
<div class="container">
<h1>WebNN — Erase People (Instance Segmentation)</h1>
<p class="subtitle">YOLOv8n-seg via ONNX Runtime Web (WebNN EP) — keep the center person, erase everyone else</p>

<div class="card">
<div class="controls">
<label for="backendSelect">Backend:</label>
<select id="backendSelect"><option value="webnn">WebNN</option><option value="wasm">WASM (CPU)</option></select>
<label for="deviceSelect">Device:</label>
<select id="deviceSelect"><option value="cpu">CPU</option><option value="gpu">GPU</option><option value="npu">NPU</option></select>
<label for="modeSelect">Mode:</label>
<select id="modeSelect">
  <option value="keep-center">Keep center person, erase others</option>
  <option value="erase-all">Erase all people</option>
</select>
<label for="eraseColor">Fill:</label>
<input type="color" id="eraseColor" value="#d0d0d0">
<input type="file" id="imageInput" accept="image/*" style="display:none">
<button id="uploadBtn" onclick="document.getElementById('imageInput').click()">Choose Image</button>
<button id="runBtn" onclick="run()">Run</button>
</div>
</div>

<div id="status" class="status info">Ready. Select backend and click Run.</div>

<div class="image-row">
<div class="image-col"><h4>Input</h4><img id="inputImage" src="../assets/group.jpg" alt="Input" crossorigin="anonymous"></div>
<div class="image-col"><h4>Result</h4><canvas id="outputCanvas"></canvas></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.all.min.js"></script>
<script>
var IMGSZ = 640;          // model input size
var NC = 80;              // number of COCO classes
var NM = 32;              // number of mask coefficients
var PERSON_CLASS = 0;     // COCO "person"
var PROTO = 160;          // mask prototype spatial size
var _session = null;

function $(id){return document.getElementById(id);}
function sS(m,c){$('status').textContent=m;$('status').className='status '+(c||'info');}

function sigmoid(x){return 1/(1+Math.exp(-x));}

// Letterbox preprocessing -> NCHW [1,3,640,640] normalized /255
function letterbox(image){
  var iw=image.naturalWidth, ih=image.naturalHeight;
  var scale=Math.min(IMGSZ/iw, IMGSZ/ih);
  var nw=Math.round(iw*scale), nh=Math.round(ih*scale);
  var padX=(IMGSZ-nw)/2, padY=(IMGSZ-nh)/2;
  var c=document.createElement('canvas'); c.width=IMGSZ; c.height=IMGSZ;
  var ctx=c.getContext('2d');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,IMGSZ,IMGSZ);
  ctx.drawImage(image, padX, padY, nw, nh);
  var d=ctx.getImageData(0,0,IMGSZ,IMGSZ).data;
  var N=IMGSZ*IMGSZ, t=new Float32Array(3*N);
  for(var i=0;i<N;i++){ t[i]=d[i*4]/255; t[N+i]=d[i*4+1]/255; t[2*N+i]=d[i*4+2]/255; }
  return {tensor:t, padX:padX, padY:padY, scale:scale};
}

function iou(a,b){ // a,b = [x1,y1,x2,y2]
  var ix1=Math.max(a[0],b[0]), iy1=Math.max(a[1],b[1]);
  var ix2=Math.min(a[2],b[2]), iy2=Math.min(a[3],b[3]);
  var iw=Math.max(0,ix2-ix1), ih=Math.max(0,iy2-iy1);
  var inter=iw*ih;
  var ua=(a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-inter;
  return ua>0? inter/ua : 0;
}

function nms(boxes, scores, thr){
  var idx=scores.map(function(s,i){return i;}).sort(function(a,b){return scores[b]-scores[a];});
  var keep=[];
  while(idx.length){
    var cur=idx.shift(); keep.push(cur);
    idx=idx.filter(function(j){ return iou(boxes[cur], boxes[j]) < thr; });
  }
  return keep;
}

// Decode raw output0 [1,116,8400] into detections (person class)
function decodeDetections(o0){
  var d=o0.data; // Float32Array length 116*8400
  var nAnchors=8400;
  var stride=nAnchors;
  var dets=[];
  for(var i=0;i<nAnchors;i++){
    var cx=d[i], cy=d[stride+i], w=d[2*stride+i], h=d[3*stride+i];
    var score=d[4*stride+i]; // class 0 = person, already sigmoid
    if(score < 0.4) continue;
    var coeffs=new Float32Array(NM);
    for(var k=0;k<NM;k++) coeffs[k]=d[(4+NC+k)*stride+i];
    var x1=cx-w/2, y1=cy-h/2, x2=cx+w/2, y2=cy+h/2;
    dets.push({box:[x1,y1,x2,y2], cx:cx, cy:cy, w:w, h:h, score:score, coeffs:coeffs});
  }
  return dets;
}

// Compute instance mask [160,160] from proto [1,32,160,160] and coeffs [32]
function instanceMask(protoData, coeffs){
  var N=PROTO*PROTO, mask=new Float32Array(N);
  for(var k=0;k<NM;k++){
    var c=coeffs[k]; if(c===0) continue;
    var off=k*N;
    for(var i=0;i<N;i++) mask[i]+=c*protoData[off+i];
  }
  for(var i=0;i<N;i++) mask[i]=sigmoid(mask[i]);
  return mask;
}

// Crop+resize a 160x160 mask to a box and return ImageData at box resolution
function maskToImageData(mask, x1, y1, w, h){
  // clamp box to [0,640]
  var bx1=Math.max(0,x1), by1=Math.max(0,y1);
  var bx2=Math.min(IMGSZ,x1+w), by2=Math.min(IMGSZ,y1+h);
  var bw=Math.max(1,Math.round(bx2-bx1)), bh=Math.max(1,Math.round(by2-by1));
  var src=document.createElement('canvas'); src.width=PROTO; src.height=PROTO;
  var sctx=src.getContext('2d');
  var img=sctx.createImageData(PROTO,PROTO);
  for(var i=0;i<PROTO*PROTO;i++){ var v=Math.round(mask[i]*255); img.data[i*4]=v; img.data[i*4+1]=v; img.data[i*4+2]=v; img.data[i*4+3]=255; }
  sctx.putImageData(img,0,0);
  var dst=document.createElement('canvas'); dst.width=bw; dst.height=bh;
  var dctx=dst.getContext('2d');
  // proto-space crop: box coords / 4
  dctx.drawImage(src, bx1/4, by1/4, (bx2-bx1)/4, (by2-by1)/4, 0, 0, bw, bh);
  return dctx.getImageData(0,0,bw,bh);
}

async function loadModel(backend, device){
  var resp=await fetch('yolov8n-seg.onnx');
  var buf=await resp.arrayBuffer();
  if(backend==='webnn'){
    try{
      return await ort.InferenceSession.create(buf, {executionProviders: [{name:'webnn', deviceType:device}]});
    }catch(e){
      console.warn('WebNN EP failed, falling back to WASM:', e.message);
      sS('WebNN EP unsupported for this model — using WASM fallback...','info');
      return await ort.InferenceSession.create(buf, {executionProviders: ['wasm']});
    }
  }
  return await ort.InferenceSession.create(buf, {executionProviders: ['wasm']});
}

async function run(){
  var btn=$('runBtn'), img=$('inputImage'), backend=$('backendSelect').value, device=$('deviceSelect').value;
  var mode=$('modeSelect').value;
  var eraseColor=$('eraseColor').value;
  try{
    btn.disabled=true;
    if(!img.complete){ sS('Waiting for image...','info'); await new Promise(function(r){img.onload=r;}); }

    sS('Loading YOLOv8n-seg model (13 MB)...','info');
    if(!_session){
      _session=await loadModel(backend, device);
    }
    var session=_session;

    var iw=img.naturalWidth, ih=img.naturalHeight;
    sS('Preprocessing (letterbox 640×640)...','info');
    var lb=letterbox(img);

    sS('Running inference ('+backend.toUpperCase()+')...','info');
    var feeds={images: new ort.Tensor('float32', lb.tensor, [1,3,IMGSZ,IMGSZ])};
    var t0=performance.now();
    var out=await session.run(feeds);
    var inferMs=(performance.now()-t0).toFixed(0);
    var o0=out.output0, o1=out.output1;

    sS('Decoding detections...','info');
    var dets=decodeDetections(o0);

    // NMS on boxes
    var boxes=dets.map(function(d){return d.box;});
    var scores=dets.map(function(d){return d.score;});
    var keep=nms(boxes, scores, 0.5);
    var kept=keep.map(function(i){return dets[i];});
    sS('Found '+kept.length+' person(s)');

    // Compute masks
    var protoData=new Float32Array(o1.data);
    for(var i=0;i<kept.length;i++){
      kept[i].mask=instanceMask(protoData, kept[i].coeffs);
    }

    // Determine center person (closest box center to image center)
    var centerIdx=0, best=Infinity;
    for(var i=0;i<kept.length;i++){
      var d=kept[i];
      // box center in original coords
      var cx=(d.cx-lb.padX)/lb.scale, cy=(d.cy-lb.padY)/lb.scale;
      var dist=Math.pow(cx-iw/2,2)+Math.pow(cy-ih/2,2);
      if(dist<best){best=dist; centerIdx=i;}
    }

    // Composite onto output canvas
    var ocan=$('outputCanvas');
    ocan.width=iw; ocan.height=ih;
    var octx=ocan.getContext('2d');
    octx.drawImage(img,0,0,iw,ih);

    // parse erase color
    var er=parseInt(eraseColor.slice(1,3),16), eg=parseInt(eraseColor.slice(3,5),16), eb=parseInt(eraseColor.slice(5,7),16);

    for(var i=0;i<kept.length;i++){
      var d=kept[i];
      var erase = (mode==='erase-all') ? true : (i!==centerIdx);
      if(!erase) continue;
      // clamp box in 640 space
      var cx1=Math.max(0,d.box[0]), cy1=Math.max(0,d.box[1]);
      var cx2=Math.min(IMGSZ,d.box[2]), cy2=Math.min(IMGSZ,d.box[3]);
      var cw=cx2-cx1, ch=cy2-cy1;
      if(cw<=0 || ch<=0) continue;
      // mask at box resolution (clamped, in 640 space)
      var mid=maskToImageData(d.mask, cx1, cy1, cw, ch);
      var bw=mid.width, bh=mid.height;
      // map to original image coords
      var ox1=Math.round((cx1-lb.padX)/lb.scale), oy1=Math.round((cy1-lb.padY)/lb.scale);
      var ow=Math.round(cw/lb.scale), oh=Math.round(ch/lb.scale);
      // build erase-color alpha image
      var tmp=document.createElement('canvas'); tmp.width=bw; tmp.height=bh;
      var tctx=tmp.getContext('2d');
      var eimg=tctx.createImageData(bw,bh);
      for(var p=0;p<bw*bh;p++){
        var a=mid.data[p*4]>=128?255:0; // threshold 0.5
        eimg.data[p*4]=er; eimg.data[p*4+1]=eg; eimg.data[p*4+2]=eb; eimg.data[p*4+3]=a;
      }
      tctx.putImageData(eimg,0,0);
      octx.drawImage(tmp, ox1, oy1, ow, oh);
    }

    sS('Done. '+kept.length+' person(s); erased '+(kept.length-(mode==='erase-all'?0:1))+' person(s) in '+inferMs+' ms ('+backend.toUpperCase()+')','success');
  }catch(e){ sS('Error: '+e.message,'error'); console.error(e); }
  finally{ btn.disabled=false; }
}

window.addEventListener('load',function(){
  $('imageInput').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    $('inputImage').src=URL.createObjectURL(f);
    sS('Image loaded. Click Run.','info');
  });
});
</script>
</body>
</html>
