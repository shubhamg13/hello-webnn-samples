  <script>
class WeightsFile {
  constructor(buffer, manifest) {
    this.buffer = buffer;
    this.manifest = manifest;
  }
  static async load(weightsPath, manifestPath) {
    const [wRes, mRes] = await Promise.all([fetch(weightsPath), fetch(manifestPath)]);
    if (!wRes.ok) throw new Error('Failed to load weights: ' + wRes.statusText);
    if (!mRes.ok) throw new Error('Failed to load manifest: ' + mRes.statusText);
    const buffer = await wRes.arrayBuffer();
    const manifest = await mRes.json();
    if (manifest.format !== 'wg-weights-manifest') throw new Error('Invalid manifest format');
    const magic = new TextDecoder().decode(new Uint8Array(buffer, 0, 4));
    if (magic !== 'WGWT') throw new Error('Invalid weights file');
    return new WeightsFile(buffer, manifest);
  }
  getSlice(name) {
    const t = this.manifest.tensors[name];
    if (!t) throw new Error('Tensor not found: ' + name);
    return t;
  }
}

// ---------------------------------------------------------------------------
// Node definition helpers

  return { id, type, inputs, params, weights, shape, label, detail };
}
function W(name, shape) { return { name, shape }; }
function shape(arr) { return arr.slice(); }

// Build node map
const NODE_MAP = {};
for (const n of NODES) NODE_MAP[n.id] = n;

// Edge list from node inputs
function buildEdges() {
  const edges = [];
  for (const n of NODES) {
    for (const inp of n.inputs) {
      if (NODE_MAP[inp]) edges.push({ from: inp, to: n.id });
    }
  }
  return edges;
}
const GRAPH_EDGES = buildEdges();

// ---------------------------------------------------------------------------
// Graph layout and rendering
// ---------------------------------------------------------------------------
const OP_COLORS = {
  input:   { fill: '#dbeafe', stroke: '#3b82f6', text: '#1e40af' },
  transpose: { fill: '#ede9fe', stroke: '#8b5cf6', text: '#5b21b6' },
  conv2d:  { fill: '#ffedd5', stroke: '#f97316', text: '#9a3412' },
  relu:    { fill: '#d1fae5', stroke: '#10b981', text: '#065f46' },
  add:     { fill: '#dbeafe', stroke: '#3b82f6', text: '#1e40af' },
  pad:     { fill: '#f3f4f6', stroke: '#9ca3af', text: '#4b5563' },
  maxpool: { fill: '#ccfbf1', stroke: '#14b8a6', text: '#115e59' },
  reshape: { fill: '#fce7f3', stroke: '#ec4899', text: '#9d174d' },
  concat:  { fill: '#fef3c7', stroke: '#f59e0b', text: '#92400e' }
};
const ACTIVE_COLOR = { fill: '#dbeafe', stroke: '#0052cc', text: '#1e40af' };
const HIGHLIGHT_COLOR = { fill: '#fff3e0', stroke: '#ff6d00', text: '#bf360c' };
const DIM_OPACITY = 0.3;

let _nodeLayers = {};
function layoutGraph(nodes, edges) {
  const layers = {};
  const visited = {};
  function getLayer(id) {
    if (visited[id] !== undefined) return visited[id];
    const incoming = edges.filter(e => e.to === id);
    if (incoming.length === 0) { visited[id] = 0; return 0; }
    let maxLayer = 0;
    for (const e of incoming) maxLayer = Math.max(maxLayer, getLayer(e.from) + 1);
    visited[id] = maxLayer;
    return maxLayer;
  }
  for (const n of nodes) getLayer(n.id);
  _nodeLayers = { ...visited };
  for (const n of nodes) {
    const l = visited[n.id];
    if (!layers[l]) layers[l] = [];
    layers[l].push(n.id);
  }

  const NODE_W = 120, NODE_H = 42, GAP_X = 28, GAP_Y = 10;
  const sortedLayers = Object.keys(layers).sort((a, b) => a - b);
  const positions = {};
  for (const l of sortedLayers) {
    const ids = layers[l];
    const x = +l * (NODE_W + GAP_X) + 10;
    let y = 10;
    for (const id of ids) {
      positions[id] = { x, y };
      y += NODE_H + GAP_Y;
    }
  }
  const maxW = sortedLayers.length * (NODE_W + GAP_X) + 20;
  const maxH = Math.max(...sortedLayers.map(l => layers[l].length * (NODE_H + GAP_Y) + 10));
  return { positions, nodeW: NODE_W, nodeH: NODE_H, width: Math.max(maxW, 600), height: Math.max(maxH, 80) };
}

let _selectedNodeId = null;
let _dependencyIds = new Set();

function renderGraph(selectedId) {
  const container = document.getElementById('graphContainer');
  const { positions, nodeW, nodeH, width, height } = layoutGraph(NODES, GRAPH_EDGES);
  const svgNS = 'http://www.w3.org/2000/svg';

  let svg = container.querySelector('svg');
  if (!svg) { svg = document.createElementNS(svgNS, 'svg'); container.appendChild(svg); }
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
  svg.innerHTML = '';

  // Edge marker
  const defs = document.createElementNS(svgNS, 'defs');
  ['arrowhead','arrowhead-active'].forEach((id, i) => {
    const m = document.createElementNS(svgNS, 'marker');
    m.setAttribute('id', id);
    m.setAttribute('markerWidth', '8');
    m.setAttribute('markerHeight', '6');
    m.setAttribute('refX', '8');
    m.setAttribute('refY', '3');
    m.setAttribute('orient', 'auto');
    const p = document.createElementNS(svgNS, 'polygon');
    p.setAttribute('points', '0 0, 8 3, 0 6');
    p.setAttribute('fill', i === 0 ? '#999' : '#ff6d00');
    m.appendChild(p);
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  // Compute port offsets: distribute connection points along node edges
  const srcPorts = {}, dstPorts = {};
  for (const e of GRAPH_EDGES) {
    if (!positions[e.from] || !positions[e.to]) continue;
    (srcPorts[e.from] = srcPorts[e.from] || []).push(e.to);
    (dstPorts[e.to] = dstPorts[e.to] || []).push(e.from);
  }
  function portOffset(map, id, neighbor) {
    const arr = map[id] || [];
    const idx = arr.indexOf(neighbor);
    const n = arr.length;
    if (n <= 1) return 0.5;
    return (idx + 1) / (n + 1);
  }

  // Edges
  for (const edge of GRAPH_EDGES) {
    const from = positions[edge.from];
    const to = positions[edge.to];
    if (!from || !to) continue;
    const active = _dependencyIds.has(edge.from) && _dependencyIds.has(edge.to);
    const path = document.createElementNS(svgNS, 'path');
    const y1off = portOffset(srcPorts, edge.from, edge.to);
    const y2off = portOffset(dstPorts, edge.to, edge.from);
    const x1 = from.x + nodeW, y1 = from.y + y1off * nodeH;
    const x2 = to.x, y2 = to.y + y2off * nodeH;
    const midX = (x1 + x2) / 2;

    const fl = _nodeLayers[edge.from], tl = _nodeLayers[edge.to];
    let d;
    if (tl - fl > 1) {
      let interTop = Infinity;
      for (const [id, l] of Object.entries(_nodeLayers)) {
        if (l > fl && l < tl && positions[id]) {
          interTop = Math.min(interTop, positions[id].y);
        }
      }
      const archY = Math.min(interTop, y1, y2) - 12;
      d = 'M' + x1 + ',' + y1 + ' C' + midX + ',' + archY + ' ' + midX + ',' + archY + ' ' + x2 + ',' + y2;
    } else {
      d = 'M' + x1 + ',' + y1 + ' C' + midX + ',' + y1 + ' ' + midX + ',' + y2 + ' ' + x2 + ',' + y2;
    }
    path.setAttribute('d', d);
    path.setAttribute('class', active ? 'graph-edge graph-edge-active' : 'graph-edge');
    path.setAttribute('opacity', active ? 1 : DIM_OPACITY);
    path.setAttribute('marker-end', 'url(' + (active ? '#arrowhead-active' : '#arrowhead') + ')');
    svg.appendChild(path);
  }

  // Nodes
  for (const node of NODES) {
    const pos = positions[node.id];
    if (!pos) continue;
    const isSelected = node.id === selectedId;
    const isDep = _dependencyIds.has(node.id);
    const baseColor = OP_COLORS[node.type] || OP_COLORS.conv2d;
    let fill, stroke, text;
    if (isSelected) {
      fill = HIGHLIGHT_COLOR.fill; stroke = HIGHLIGHT_COLOR.stroke; text = HIGHLIGHT_COLOR.text;
    } else if (isDep) {
      fill = ACTIVE_COLOR.fill; stroke = ACTIVE_COLOR.stroke; text = ACTIVE_COLOR.text;
    } else {
      fill = baseColor.fill; stroke = baseColor.stroke; text = baseColor.text;
    }
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'graph-node');
    g.setAttribute('data-id', node.id);
    g.setAttribute('opacity', isDep || isSelected ? 1 : DIM_OPACITY);
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => selectNode(node.id));

    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('x', pos.x);
    rect.setAttribute('y', pos.y);
    rect.setAttribute('width', nodeW);
    rect.setAttribute('height', nodeH);
    rect.setAttribute('rx', '5');
    rect.setAttribute('ry', '5');
    rect.setAttribute('fill', fill);
    rect.setAttribute('stroke', stroke);
    g.appendChild(rect);

    const typeLabel = document.createElementNS(svgNS, 'text');
    typeLabel.setAttribute('x', pos.x + nodeW / 2);
    typeLabel.setAttribute('y', pos.y + nodeH / 2 - 11);
    typeLabel.setAttribute('text-anchor', 'middle');
    typeLabel.setAttribute('dominant-baseline', 'central');
    typeLabel.setAttribute('fill', text);
    typeLabel.setAttribute('font-size', '8');
    typeLabel.setAttribute('opacity', '0.55');
    typeLabel.textContent = REF_NAMES[node.id] || node.id;
    g.appendChild(typeLabel);

    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('x', pos.x + nodeW / 2);
    label.setAttribute('y', pos.y + nodeH / 2 + (node.detail ? 0 : 2));
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('dominant-baseline', 'central');
    label.setAttribute('fill', text);
    label.setAttribute('font-size', '10');
    label.setAttribute('font-weight', '600');
    label.textContent = node.label;
    g.appendChild(label);

    if (node.detail) {
      const det = document.createElementNS(svgNS, 'text');
      det.setAttribute('x', pos.x + nodeW / 2);
      det.setAttribute('y', pos.y + nodeH / 2 + 13);
      det.setAttribute('text-anchor', 'middle');
      det.setAttribute('dominant-baseline', 'central');
      det.setAttribute('fill', text);
      det.setAttribute('font-size', '8');
      det.setAttribute('opacity', '0.7');
      det.textContent = node.detail;
      g.appendChild(det);
    }

    svg.appendChild(g);
  }
}

// ---------------------------------------------------------------------------
// Dependency tracer
// ---------------------------------------------------------------------------
function traceDeps(nodeId) {
  const deps = new Set();
  function walk(id) {
    if (deps.has(id)) return;
    deps.add(id);
    const node = NODE_MAP[id];
    if (!node) return;
    for (const inp of node.inputs) walk(inp);
  }
  walk(nodeId);
  return deps;
}

// Topological order from deps
function topoOrder(deps) {
  const inDegree = {};
  const adj = {};
  for (const id of deps) {
    const node = NODE_MAP[id];
    if (!node) continue;
    if (!adj[id]) adj[id] = [];
    if (inDegree[id] === undefined) inDegree[id] = 0;
    for (const inp of node.inputs) {
      if (deps.has(inp)) {
        adj[inp] = adj[inp] || [];
        adj[inp].push(id);
        inDegree[id] = (inDegree[id] || 0) + 1;
      }
    }
  }
  const queue = [];
  for (const id of deps) if ((inDegree[id] || 0) === 0) queue.push(id);
  const order = [];
  while (queue.length) {
    const id = queue.shift();
    order.push(id);
    for (const next of (adj[id] || [])) {
      inDegree[next]--;
      if (inDegree[next] === 0) queue.push(next);
    }
  }
  return order;
}

// ---------------------------------------------------------------------------
// Subgraph builder
// ---------------------------------------------------------------------------
function constantFromWeights(builder, weights, name, dataType, shape) {
  const sl = weights.getSlice(name);
  const buf = weights.buffer.slice(sl.byteOffset, sl.byteOffset + sl.byteLength);
  if (dataType === 'float32') return builder.constant({ dataType, shape }, new Float32Array(buf));
  if (dataType === 'int64') return builder.constant({ dataType, shape }, new BigInt64Array(buf));
  throw new Error('Unsupported type: ' + dataType);
}

async function buildSubgraph(deviceType, weights, targetId, inputData) {
  const context = await navigator.ml.createContext({ deviceType });
  const builder = new MLGraphBuilder(context);
  const deps = traceDeps(targetId);
  const order = topoOrder(deps);
  const tensors = {};

  const buildStart = performance.now();

  for (const id of order) {
    const node = NODE_MAP[id];
    if (!node) continue;
    if (node.type === 'input') {
      tensors[id] = builder.input('input', { dataType: 'float32', shape: [1,128,128,3] });
      continue;
    }
    const inTensors = node.inputs.map(i => tensors[i]).filter(Boolean);

    switch (node.type) {
      case 'transpose':
        tensors[id] = builder.transpose(inTensors[0], node.params);
        break;
      case 'reshape':
        tensors[id] = builder.reshape(inTensors[0], node.params.shape || node.shape);
        break;
      case 'conv2d': {
        const w = constantFromWeights(builder, weights, node.weights[0].name, 'float32', node.weights[0].shape);
        const p = { ...node.params };
        if (node.weights.length > 1) {
          p.bias = constantFromWeights(builder, weights, node.weights[1].name, 'float32', node.weights[1].shape);
        }
        console.log("Building conv2d", id, "weights", w, "conv2d Options", p);
        tensors[id] = builder.conv2d(inTensors[0], w, p);
        break;
      }
      case 'relu':
        tensors[id] = builder.relu(inTensors[0]);
        break;
      case 'add':
        tensors[id] = builder.add(inTensors[0], inTensors[1]);
        break;
      case 'pad':
        tensors[id] = builder.pad(inTensors[0], node.params.paddingBegin || [0,0,0,0], node.params.paddingEnd || [0,0,0,0]);
        break;
      case 'maxpool':
        tensors[id] = builder.maxPool2d(inTensors[0], node.params);
        break;
      case 'concat':
        tensors[id] = builder.concat(inTensors, node.params.axis || 0);
        break;
    }
  }

  const output = tensors[targetId];
  if (!output) throw new Error('Failed to build target node: ' + targetId);

  const namedOutputs = { output };
  const outputShapes = {};
  for (const [name, op] of Object.entries(namedOutputs)) {
    try { outputShapes[name] = Array.from(op.shape); } catch(e) { outputShapes[name] = null; }
  }
  const graph = await builder.build(namedOutputs);
  const buildTime = performance.now() - buildStart;

  // Use provided inputData or generate fresh
  if (!inputData) {
    inputData = new Float32Array(128*128*3);
    if (fillSelect.value === 'fixed') {
      inputData.fill(parseFloat(fixedValueInput.value) || 0);
    } else {
      for (let i = 0; i < inputData.length; i++) inputData[i] = Math.random() * 2 - 1;
    }
  }
  const inputTensor = await context.createTensor({ dataType: 'float32', shape: [1,128,128,3], writable: true });
  context.writeTensor(inputTensor, inputData);

  // Output tensor
  const outShape = outputShapes.output || node.shape;
  const outputTensor = await context.createTensor({ dataType: 'float32', shape: outShape, readable: true });

  const t0 = performance.now();
  context.dispatch(graph, { input: inputTensor }, { output: outputTensor });
  const inferTime = performance.now() - t0;

  const buf = await context.readTensor(outputTensor);
  const result = new Float32Array(buf);

  // Benchmark
  const NUM_RUNS = 0;
  const times = [];
  for (let i = 0; i < NUM_RUNS; i++) {
    const tb = performance.now();
    context.dispatch(graph, { input: inputTensor }, { output: outputTensor });
    await context.readTensor(outputTensor);
    times.push(performance.now() - tb);
  }
  const avgTime = times.reduce((a, b) => a + b, 0) / times.length;

  return { result, shape: outShape, buildTime, inferTime, avgTime, inputData };
}

// ---------------------------------------------------------------------------
// Input generation
// ---------------------------------------------------------------------------
let _storedInputData = null;

function generateInput() {
  if (fillSelect.value === 'image') {
    const img = document.getElementById('inputImage');
    if (!img.complete || !img.naturalWidth) {
      document.getElementById('inputPreview').innerHTML = '<span style="color:#d32f2f;">No image loaded. Choose an image first.</span>';
      return;
    }
    _storedInputData = preprocessImage(img);
    const preview = Array.from(_storedInputData.slice(0, 8)).map(v => v.toFixed(4)).join(', ');
    document.getElementById('inputPreview').innerHTML =
      'Generated (image) [' + _storedInputData.length + ' values]: <b>[' + preview + ', ...]</b>';
    return;
  }

  _storedInputData = new Float32Array(128*128*3);
  if (fillSelect.value === 'fixed') {
    _storedInputData.fill(parseFloat(fixedValueInput.value) || 0);
  } else {
    for (let i = 0; i < _storedInputData.length; i++) _storedInputData[i] = Math.random() * 2 - 1;
  }
  const preview = Array.from(_storedInputData.slice(0, 8)).map(v => v.toFixed(4)).join(', ');
  document.getElementById('inputPreview').innerHTML =
    'Generated [' + _storedInputData.length + ' values]: <b>[' + preview + ', ...]</b>';
}

function preprocessImage(imageElement) {
  const targetWidth = 128;
  const targetHeight = 128;
  const originalWidth = imageElement.naturalWidth;
  const originalHeight = imageElement.naturalHeight;

  const aspectRatio = originalWidth / originalHeight;
  const targetAspectRatio = targetWidth / targetHeight;

  let scale, canvasWidth, canvasHeight;
  if (aspectRatio > targetAspectRatio) {
    scale = targetWidth / originalWidth;
    canvasHeight = Math.round(originalHeight * scale);
    canvasWidth = targetWidth;
  } else {
    scale = targetHeight / originalHeight;
    canvasWidth = Math.round(originalWidth * scale);
    canvasHeight = targetHeight;
  }

  const canvas = document.createElement('canvas');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, targetWidth, targetHeight);

  const drawWidth = Math.round(canvasWidth);
  const drawHeight = Math.round(canvasHeight);
  const drawX = Math.round((targetWidth - drawWidth) / 2);
  const drawY = Math.round((targetHeight - drawHeight) / 2);

  ctx.drawImage(imageElement, drawX, drawY, drawWidth, drawHeight);

  const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
  const data = imageData.data;
  const tensor = new Float32Array(targetHeight * targetWidth * 3);

  for (let i = 0; i < targetHeight * targetWidth; i++) {
    const r = data[i * 4] / 255;
    const g = data[i * 4 + 1] / 255;
    const b = data[i * 4 + 2] / 255;
    tensor[i * 3] = r * 2 - 1;
    tensor[i * 3 + 1] = g * 2 - 1;
    tensor[i * 3 + 2] = b * 2 - 1;
  }

  return tensor;
}

// ---------------------------------------------------------------------------
// Selection and running
// ---------------------------------------------------------------------------
function selectNode(id) {
  _selectedNodeId = id;
  _dependencyIds = traceDeps(id);
  renderGraph(id);

  const node = NODE_MAP[id];
  const el = document.getElementById('nodeInfo');
  const isInput = id === 'input';
  el.innerHTML = '<strong>' + node.label + '</strong> <span style="color:#888;">(' + node.id + ')</span><br>' +
    'type: ' + node.type + ' | shape: ' + JSON.stringify(node.shape) + '<br>' +
    'deps: ' + (_dependencyIds.size - 1) + ' nodes' +
    (isInput ? '<br><span style="color:#999;font-style:italic;">Select any operator node to run</span>' : '');
  document.getElementById('runBtn').disabled = isInput;
  document.getElementById('runAllBtn').disabled = isInput;
}

async function runSelected() {
  const runBtn = document.getElementById('runBtn');
  const targetId = _selectedNodeId;
  if (!targetId) { alert('Click a node in the graph first.'); return; }
  const deviceType = deviceSelect.value;

  try {
    runBtn.disabled = true;
    statusEl.className = 'status info';
    if (!navigator.ml) throw new Error('WebNN not supported');

    statusEl.textContent = 'Loading weights...';
    const weights = await WeightsFile.load(
      '../face_detector-webnn/face_detector.weights',
      '../face_detector-webnn/face_detector.manifest.json'
    );

    if (!_storedInputData) generateInput();

    statusEl.textContent = 'Building on ' + deviceType.toUpperCase() + '...';
    const main = await buildSubgraph(deviceType, weights, targetId, _storedInputData);

    const node = NODE_MAP[targetId];
    statusEl.className = 'status success';
    statusEl.textContent = node.label + ' (' + targetId + ') | ' + deviceType.toUpperCase() + ' build:' + main.buildTime.toFixed(2) + 'ms avg:' + main.avgTime.toFixed(2) + 'ms';

    document.getElementById('resultsCard').style.display = '';
    let html = '<div><strong>input</strong> shape=[1,128,128,3] (float32)</div>';
    const inPreview = Array.from(main.inputData.slice(0, 8)).map(v => v.toFixed(4)).join(', ');
    html += '<pre>[' + inPreview + ', ...]</pre>';

    html += '<div style="margin-top:0.5rem;"><strong>output</strong> shape=' + JSON.stringify(main.shape) + ' (float32)</div>';
    const outPreview = Array.from(main.result.slice(0, 16)).map(v => v.toFixed(6)).join(', ');
    html += '<div style="font-size:0.8rem;color:#555;">' + deviceType.toUpperCase() + ' output</div>';
    html += '<pre>[' + outPreview + (main.result.length > 16 ? ', ...' : '') + ']</pre>';

    document.getElementById('results').innerHTML = html;

  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = 'Error: ' + err.message;
    console.error(err);
  } finally {
    runBtn.disabled = false;
  }
}

async function runAll() {
  const runAllBtn = document.getElementById('runAllBtn');
  const deviceType = deviceSelect.value;

  try {
    runAllBtn.disabled = true;
    statusEl.className = 'status info';
    if (!navigator.ml) throw new Error('WebNN not supported');

    const weights = await WeightsFile.load(
      '../face_detector-webnn/face_detector.weights',
      '../face_detector-webnn/face_detector.manifest.json'
    );

    if (!_storedInputData) generateInput();

    document.getElementById('resultsCard').style.display = '';
    let html = '<table style="width:100%;border-collapse:collapse;font-size:0.8rem;">';
    html += '<tr style="color:#666;">' +
      '<th>Node</th><th>Type</th><th>Shape</th><th>Build(ms)</th><th>' + deviceType.toUpperCase() + '(ms)</th></tr>';

    let fails = [];

    for (let i = 0; i < NODES.length; i++) {
      const node = NODES[i];
      if (node.type === 'input') continue;
      statusEl.textContent = 'Building ' + node.id + ' (' + (i+1) + '/' + NODES.length + ')...';

      try {
        const main = await buildSubgraph(deviceType, weights, node.id, _storedInputData);
        html += '<tr><td>' + node.id + '</td><td>' + node.type + '</td><td>' + JSON.stringify(main.shape) + '</td>' +
          '<td>' + main.buildTime.toFixed(2) + '</td><td>' + main.avgTime.toFixed(2) + '</td></tr>';
      } catch (e) {
        fails.push(node.id);
        html += '<tr style="background:#ffebee;"><td>' + node.id + '</td><td>' + node.type + '</td><td colspan="3">ERROR: ' + e.message + '</td></tr>';
      }
    }
    html += '</table>';
    document.getElementById('results').innerHTML = html;

    let msg = 'All ' + NODES.length + ' nodes processed.';
    if (fails.length) msg += ' Failures: ' + fails.join(', ') + '.';
    statusEl.className = 'status success';
    statusEl.textContent = msg;

  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = 'Error: ' + err.message;
    console.error(err);
  } finally {
    runAllBtn.disabled = false;
  }
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
const statusEl = document.getElementById('status');
const fillSelect = document.getElementById('fillSelect');
const fixedValueInput = document.getElementById('fixedValue');
const imageInput = document.getElementById('imageInput');
const imageBtn = document.getElementById('imageBtn');
const imagePreview = document.getElementById('imagePreview');
const inputImage = document.getElementById('inputImage');
const imageInfo = document.getElementById('imageInfo');

fillSelect.addEventListener('change', () => {
  const mode = fillSelect.value;
  fixedValueInput.style.display = mode === 'fixed' ? '' : 'none';
  imageBtn.style.display = mode === 'image' ? '' : 'none';
  imagePreview.style.display = mode === 'image' ? '' : 'none';
  if (mode === 'image') {
    if (!inputImage.naturalWidth) {
      inputImage.src = '../assets/portrait.jpg';
      inputImage.style.display = '';
      inputImage.onload = () => {
        imageInfo.textContent = 'portrait.jpg \u2014 ' + inputImage.naturalWidth + '\u00d7' + inputImage.naturalHeight;
        generateInput();
      };
    } else if (!_storedInputData) {
      generateInput();
    }
  } else {
    inputImage.style.display = 'none';
    imageInfo.textContent = '';
  }
});

imageInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  inputImage.src = url;
  inputImage.style.display = '';
  imageInfo.textContent = file.name + ' (' + file.type + ')';
  inputImage.onload = () => {
    imageInfo.textContent = file.name + ' \u2014 ' + inputImage.naturalWidth + '\u00d7' + inputImage.naturalHeight;
    generateInput();
  };
});

// Generate input and select input node by default
generateInput();
selectNode('input');
  </script>
