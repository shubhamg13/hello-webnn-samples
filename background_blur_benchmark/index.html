<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Blur — CPU vs WebNN</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 1.5rem; }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .subtitle { color: #666; font-size: .85rem; margin-bottom: 1rem; }
  .card { background: #fff; border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: .75rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .controls { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
  .control-label { font-weight: 600; font-size: .85rem; }
  .segmented { display: inline-flex; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
  .seg-btn { background: #fff; color: #1a1a1a; border: none; border-radius: 0; padding: .45rem .9rem; font-size: .85rem; font-weight: 600; min-width: 4rem; cursor: pointer; }
  .seg-btn + .seg-btn { border-left: 1px solid #ddd; }
  .seg-btn:hover { background: #eef3ff; }
  .seg-btn.active { background: rgba(0,47,167,1); color: #fff; }
  button { padding: .45rem .9rem; border-radius: 4px; font-size: .85rem; cursor: pointer; background: rgba(0,47,167,1); color: #fff; border: none; font-weight: 500; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  input[type=range] { vertical-align: middle; }
  .status { padding: .6rem 1rem; font-size: .85rem; border-radius: 4px; margin-bottom: .75rem; }
  .status.info { background: #e3f2fd; border-left: 3px solid #2196F3; }
  .status.success { background: #e9f8f0; border-left: 3px solid #068906; }
  .status.error { background: #ffebee; border-left: 3px solid #f44336; }

  .side-by-side { display: flex; gap: 1rem; flex-wrap: wrap; }
  .side { flex: 1; min-width: 320px; }
  .side h3 { font-size: .95rem; margin-bottom: .4rem; }
  .side .tag { font-size: .7rem; padding: 1px 6px; border-radius: 3px; color: #fff; vertical-align: middle; }
  .tag-wasm { background: #ff6f00; }
  .tag-webnn { background: #0052cc; }
  canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 4px; }
  .metrics { font-size: .8rem; color: #333; margin-top: .4rem; line-height: 1.5; }
  .metrics b { color: rgba(0,47,167,1); }
  .metrics .m-row { display: flex; justify-content: space-between; max-width: 340px; }
  .metrics .section { font-weight: 600; color: #888; margin-top: .3rem; font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; }

  table { width: 100%; border-collapse: collapse; margin-top: .5rem; font-size: .8rem; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; }
  #benchCard { display: none; }

  #verdict {
    display: none; margin-top: .5rem; padding: .75rem 1rem; border-radius: 6px;
    font-size: .9rem; font-weight: 600; line-height: 1.6;
  }
  #verdict.win-npu { background: #e9f8f0; border-left: 4px solid #068906; }
  #verdict.win-cpu { background: #fff3e0; border-left: 4px solid #ff6f00; }
  #verdict .big { font-size: 1.05rem; }
  .delta-better { color: #068906; font-weight: 700; }
</style>
</head>
<body>
<div class="container">
  <h1>Background Blur — CPU vs WebNN</h1>
  <p class="subtitle">Same MediaPipe Selfie Segmentation model, pure WebNN on two devices: CPU vs NPU/GPU. Gaussian background blur + person kept sharp.</p>

  <div class="card">
    <div class="controls">
      <span class="control-label">Input:</span>
      <div class="segmented" id="inputGroup">
        <button type="button" class="seg-btn" data-value="image">Image</button>
        <button type="button" class="seg-btn" data-value="video">Video</button>
        <button type="button" class="seg-btn" data-value="camera">Camera</button>
      </div>
      <input type="hidden" id="inputSelect" value="image">

      <span class="control-label">WebNN device:</span>
      <div class="segmented" id="deviceGroup">
        <button type="button" class="seg-btn" data-value="cpu">CPU</button>
        <button type="button" class="seg-btn" data-value="gpu">GPU</button>
        <button type="button" class="seg-btn" data-value="npu">NPU</button>
      </div>
      <input type="hidden" id="deviceSelect" value="npu">

      <label style="font-size:.8rem;font-weight:600;"><input type="checkbox" id="useWasmCheck"> Use WASM (ONNX Runtime) for CPU side</label>

      <span class="control-label">Blur:</span>
      <input type="range" id="blurSlider" min="2" max="32" value="14">
      <span id="blurVal" style="font-size:.8rem;">14px</span>

      <input type="file" id="imageInput" accept="image/*" style="display:none">
      <button id="uploadBtn" onclick="document.getElementById('imageInput').click()">Choose Image</button>
      <button id="runBtn" onclick="start()">Run</button>
    </div>
    <div class="controls" style="margin-top:.5rem;">
      <span class="control-label">Benchmark:</span>
      <div class="segmented" id="benchGroup">
        <button type="button" class="seg-btn" data-value="10">Quick 10s</button>
        <button type="button" class="seg-btn" data-value="30">Battery 30s</button>
      </div>
      <input type="hidden" id="benchSelect" value="10">
      <button id="benchBtn" onclick="benchmark()">Run Benchmark</button>
    </div>
  </div>

  <div id="status" class="status info">Loading models…</div>

  <div class="card">
    <div class="side-by-side">
      <div class="side">
        <h3>CPU <span class="tag tag-wasm" id="cpuTag">WebNN</span></h3>
        <canvas id="canvasWasm" width="480" height="360"></canvas>
        <div class="metrics" id="metricsWasm"></div>
      </div>
      <div class="side">
        <h3>WebNN — Accelerator <span class="tag tag-webnn" id="webnnTag">NPU</span></h3>
        <canvas id="canvasWebnn" width="480" height="360"></canvas>
        <div class="metrics" id="metricsWebnn"></div>
      </div>
    </div>
  </div>

  <div class="card" id="benchCard">
    <h3>Isolated Benchmark</h3>
    <div id="verdict"></div>
    <table id="benchTable"></table>
  </div>
</div>

<img id="sourceImage" src="../assets/portrait.jpg" crossorigin="anonymous" style="display:none">
<video id="sourceVideo" src="../virtual_tryon/514442_1_Person_20s_1920x1080.mp4" muted loop playsinline style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"></video>
<video id="sourceCamera" autoplay muted playsinline style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"></video>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.0/dist/ort.min.js"></script>
<script src="selfie_seg_webnn.js"></script>
<script>
'use strict';
var IMGSZ = 256;
var _cpuModel = null;
var _webnnModel = null;
var _wasmSession = null;
var _inputMode = 'image';
var _running = false;
var _rafId = null;
var _frameW = 480, _frameH = 360;
var _battery = null;         // BatteryManager if available
var _jank = { cpu: 0, accel: 0 };
var _longtaskObserver = null;

// CPU-load worker (heuristic estimate)
var _cpuWorker = null, _cpuBase = null, _cpuLoad = null, _cpuSamples = null, _collectCpu = false;

function _newMetrics() { return { frames: 0, times: [], block: [], fps: 0, lastT: 0, firstFrame: null, cpu: [] }; }
var _m = { cpu: _newMetrics(), accel: _newMetrics() };

function $(id){ return document.getElementById(id); }
function sS(m, c){ var e = $('status'); e.textContent = m; e.className = 'status ' + (c || 'info'); }

function initSegmented(groupId, inputId, cb) {
  var group = $(groupId), input = $(inputId);
  if (!group || !input) return;
  function select(v) {
    input.value = v;
    for (var b of group.querySelectorAll('.seg-btn')) b.classList.toggle('active', b.dataset.value === v);
    if (cb) cb(v);
  }
  group.addEventListener('click', function (ev) {
    var b = ev.target.closest('.seg-btn');
    if (b) select(b.dataset.value);
  });
  select(input.value);
}

// ---- feature detection helpers ----
function hasGetUserMedia() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
function getMemoryMB() { return performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(1) : 'n/a'; }
function getBattery() { return _battery ? Math.round(_battery.level * 100) + '%' + (_battery.charging ? ' ⚡' : '') : 'n/a'; }
function batteryLevel() { return _battery ? _battery.level : null; }
function hasBattery() { return !!_battery; }

// ---- CPU load worker (estimate) ----
function startCpuWorker() {
  if (_cpuWorker || typeof Worker === 'undefined') return;
  var code = [
    'var WORK = 2000000, n = 0, t0 = Date.now();',
    'setInterval(function(){',
    '  var t = Date.now();',
    '  postMessage({ n: n, dt: Math.max(1, t - t0) });',
    '  n = 0; t0 = t;',
    '}, 400);',
    'function spin(){',
    '  var x = 0;',
    '  for (var i = 0; i < WORK; i++) x += (i & 1);',
    '  n++;',
    '  setTimeout(spin, 0);',
    '}',
    'spin();'
  ].join('\n');
  try {
    _cpuWorker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
    _cpuWorker.onmessage = function (ev) {
      var opsSec = ev.data.n * 1000 / ev.data.dt;
      if (_cpuBase === null || opsSec > _cpuBase) _cpuBase = opsSec;
      _cpuLoad = _cpuBase > 0 ? Math.max(0, Math.min(100, (1 - opsSec / _cpuBase) * 100)) : 0;
      if (_collectCpu && _cpuSamples) _cpuSamples.push(_cpuLoad);
    };
  } catch (e) { _cpuWorker = null; }
}

// ---- model loading ----
function useWasm() { return $('useWasmCheck').checked; }
async function loadWebnn(deviceType) {
  var m = new SelfieSegmentationWebNN();
  await m.load(deviceType);
  return m;
}
async function loadWasm() {
  if (typeof ort === 'undefined') throw new Error('ONNX Runtime failed to load (ort is undefined).');
  // single-threaded WASM: no SharedArrayBuffer needed (works in Servo)
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.0/dist/';
  var resp = await fetch('model.onnx');
  var buf = await resp.arrayBuffer();
  return ort.InferenceSession.create(buf, { executionProviders: ['wasm'] });
}
async function loadModels() {
  var dev = $('deviceSelect').value;
  var cpuBackend = useWasm() ? 'WASM (ONNX)' : 'WebNN CPU';
  sS('Loading models (' + cpuBackend + ' + WebNN ' + dev.toUpperCase() + ')…', 'info');
  $('webnnTag').textContent = dev.toUpperCase();
  if (useWasm()) {
    if (!_wasmSession) _wasmSession = await loadWasm();
  } else {
    if (!_cpuModel) _cpuModel = await loadWebnn('cpu');
  }
  if (!_webnnModel) _webnnModel = await loadWebnn(dev);
  sS('Models ready. Click Run.', 'success');
}
function modelsReady() {
  if (!_webnnModel) return false;
  if (useWasm()) return !!_wasmSession;
  return !!_cpuModel;
}

// ---- input source ----
function getSourceElement() {
  if (_inputMode === 'video') return $('sourceVideo');
  if (_inputMode === 'camera') return $('sourceCamera');
  return $('sourceImage');
}
async function getCameraStream() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('Camera not supported here — getUserMedia requires a secure context (HTTPS or localhost) and a supporting browser (Chromium).');
  }
  var cam = $('sourceCamera');
  if (cam.srcObject) return;
  var stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  } catch (e) {
    throw new Error('Camera access denied or unavailable: ' + e.message);
  }
  cam.srcObject = stream;
  await new Promise(function (resolve) {
    if (cam.readyState >= 1 && cam.videoWidth > 0) return resolve();
    var done = false;
    function fin() {
      if (done) return;
      done = true;
      cam.removeEventListener('loadedmetadata', fin);
      cam.removeEventListener('loadeddata', fin);
      cam.removeEventListener('canplay', fin);
      resolve();
    }
    cam.addEventListener('loadedmetadata', fin);
    cam.addEventListener('loadeddata', fin);
    cam.addEventListener('canplay', fin);
    setTimeout(fin, 5000);
  });
  try { await cam.play(); } catch (e) {}
}
async function prepareSource() {
  var el = getSourceElement();
  if (_inputMode === 'camera') await getCameraStream();
  if (_inputMode === 'video') await el.play().catch(function(){});
  var vw = el.videoWidth || el.naturalWidth || 0;
  var vh = el.videoHeight || el.naturalHeight || 0;
  if (!vw || !vh) throw new Error('No video frames available — grant camera permission (and reload), or the video file failed to load.');
  var scale = Math.min(1, 480 / vw);
  _frameW = Math.max(2, Math.round(vw * scale));
  _frameH = Math.max(2, Math.round(vh * scale));
  $('canvasWasm').width = _frameW; $('canvasWasm').height = _frameH;
  $('canvasWebnn').width = _frameW; $('canvasWebnn').height = _frameH;
}

// ---- preprocessing (two variants: WebNN uses [-1,1], ONNX uses [0,1]) ----
function preprocess(frameCanvas, variant) {
  var c = document.createElement('canvas'); c.width = IMGSZ; c.height = IMGSZ;
  var ctx = c.getContext('2d');
  ctx.drawImage(frameCanvas, 0, 0, IMGSZ, IMGSZ);
  var d = ctx.getImageData(0, 0, IMGSZ, IMGSZ).data;
  var N = IMGSZ * IMGSZ, t = new Float32Array(3 * N);
  if (variant === 'wasm') {
    for (var j = 0; j < N; j++) {
      t[j] = d[j*4] / 255;
      t[N+j] = d[j*4+1] / 255;
      t[2*N+j] = d[j*4+2] / 255;
    }
  } else {
    for (var i = 0; i < N; i++) {
      t[i] = (d[i*4] - 127.5) / 127.5;
      t[N+i] = (d[i*4+1] - 127.5) / 127.5;
      t[2*N+i] = (d[i*4+2] - 127.5) / 127.5;
    }
  }
  return t;
}

function maskToAlphaCanvas(mask, W, H) {
  var c = document.createElement('canvas'); c.width = IMGSZ; c.height = IMGSZ;
  var ctx = c.getContext('2d');
  var img = ctx.createImageData(IMGSZ, IMGSZ);
  for (var i = 0; i < IMGSZ*IMGSZ; i++) {
    img.data[i*4] = 255; img.data[i*4+1] = 255; img.data[i*4+2] = 255;
    img.data[i*4+3] = Math.round(Math.max(0, Math.min(1, mask[i])) * 255);
  }
  ctx.putImageData(img, 0, 0);
  var out = document.createElement('canvas'); out.width = W; out.height = H;
  out.getContext('2d').drawImage(c, 0, 0, W, H);
  return out;
}

function renderBlur(resultCanvas, frameCanvas, mask, blurRadius) {
  var W = resultCanvas.width, H = resultCanvas.height;
  var rctx = resultCanvas.getContext('2d');
  rctx.clearRect(0, 0, W, H);
  rctx.filter = 'blur(' + blurRadius + 'px)';
  rctx.drawImage(frameCanvas, 0, 0, W, H);
  rctx.filter = 'none';
  var sharp = document.createElement('canvas'); sharp.width = W; sharp.height = H;
  var sctx = sharp.getContext('2d');
  sctx.drawImage(frameCanvas, 0, 0, W, H);
  sctx.globalCompositeOperation = 'destination-in';
  sctx.drawImage(maskToAlphaCanvas(mask, W, H), 0, 0, W, H);
  sctx.globalCompositeOperation = 'source-over';
  rctx.drawImage(sharp, 0, 0, W, H);
}

// ---- inference (returns { mask, blockMs, totalMs }) ----
async function inferCpu(frameCanvas) {
  if (useWasm()) {
    var t = preprocess(frameCanvas, 'wasm');
    var feeds = { 'pixel_values': new ort.Tensor('float32', t, [1,3,IMGSZ,IMGSZ]) };
    var t0 = performance.now();
    var out = await _wasmSession.run(feeds);   // single-threaded: blocks main thread
    var ms = performance.now() - t0;
    return { mask: out['alphas'].data, blockMs: ms, totalMs: ms };
  }
  return await _cpuModel.run(preprocess(frameCanvas));
}
async function inferWebnn(frameCanvas) {
  return await _webnnModel.run(preprocess(frameCanvas));
}

function getFrameCanvas() {
  var el = getSourceElement();
  var c = document.createElement('canvas'); c.width = _frameW; c.height = _frameH;
  c.getContext('2d').drawImage(el, 0, 0, _frameW, _frameH);
  return c;
}

// ---- metrics ----
function recordMetrics(side, totalMs, blockMs) {
  var m = _m[side];
  m.frames++;
  m.times.push(totalMs);
  m.block.push(blockMs);
  if (_cpuLoad !== null) m.cpu.push(_cpuLoad);
  var now = performance.now();
  if (m.lastT && (now - m.lastT) >= 1000) {
    m.fps = Math.round(m.frames / ((now - m.lastT) / 1000));
    m.frames = 0;
    m.lastT = now;
  } else if (!m.lastT) {
    m.lastT = now;
  }
}
function avg(arr) { return arr.length ? (arr.reduce(function(a,b){return a+b;},0)/arr.length) : 0; }
function median(arr) {
  if (!arr.length) return 0;
  var s = arr.slice().sort(function(a,b){return a-b;});
  var mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
}
function percentile(arr, p) {
  if (!arr.length) return 0;
  var s = arr.slice().sort(function(a,b){return a-b;});
  var idx = (s.length - 1) * p;
  var lo = Math.floor(idx), hi = Math.ceil(idx);
  return lo === hi ? s[lo] : s[lo] + (s[hi] - s[lo]) * (idx - lo);
}
function fmt(side) {
  var m = _m[side];
  var a = avg(m.times), md = median(m.times), p90 = percentile(m.times, 0.9), p99 = percentile(m.times, 0.99);
  var blockAvg = avg(m.block);
  var cpuAvg = avg(m.cpu);
  var first = m.firstFrame === null ? '—' : m.firstFrame.toFixed(1) + ' ms';
  var busyPct = m.times.length ? Math.min(100, (blockAvg / Math.max(1, a)) * 100) : 0;
  return '<div class="section">Speed</div>' +
         '<div class="m-row"><span>FPS</span><b>' + (m.fps || '—') + '</b></div>' +
         '<div class="m-row"><span>Inference avg / median</span><b>' + a.toFixed(2) + ' / ' + md.toFixed(2) + ' ms</b></div>' +
         '<div class="m-row"><span>Inference p90 / p99</span><b>' + p90.toFixed(2) + ' / ' + p99.toFixed(2) + ' ms</b></div>' +
         '<div class="m-row"><span>First frame</span><b>' + first + '</b></div>' +
         '<div class="section">CPU / energy</div>' +
         '<div class="m-row"><span>Main-thread blocked / frame</span><b>' + blockAvg.toFixed(2) + ' ms</b></div>' +
         '<div class="m-row"><span>Main-thread busy % of frame</span><b>' + busyPct.toFixed(0) + '%</b></div>' +
         '<div class="m-row"><span>≈ CPU load (estimate)</span><b>' + (m.cpu.length ? cpuAvg.toFixed(0) + '%' : '—') + '</b></div>' +
         '<div class="m-row"><span>Long tasks</span><b>' + _jank[side] + '</b></div>' +
         '<div class="m-row"><span>JS heap</span><b>' + getMemoryMB() + ' MB</b></div>' +
         '<div class="m-row"><span>Battery</span><b>' + getBattery() + '</b></div>';
}
function updateMetrics() {
  $('metricsWasm').innerHTML = fmt('cpu');
  $('metricsWebnn').innerHTML = fmt('accel');
}

// ---- main loop ----
async function processOnce() {
  var frame = getFrameCanvas();
  var blur = parseInt($('blurSlider').value, 10);

  var r = await inferCpu(frame);
  renderBlur($('canvasWasm'), frame, r.mask, blur);
  recordMetrics('cpu', r.totalMs, r.blockMs);

  r = await inferWebnn(frame);
  renderBlur($('canvasWebnn'), frame, r.mask, blur);
  recordMetrics('accel', r.totalMs, r.blockMs);

  updateMetrics();
}

async function loop() {
  if (!_running) return;
  try { await processOnce(); } catch (e) { console.error(e); }
  _rafId = requestAnimationFrame(loop);
}

async function start() {
  try {
    $('runBtn').disabled = true;
    if (!modelsReady()) await loadModels();
    await prepareSource();
    _m = { cpu: _newMetrics(), accel: _newMetrics() };
    var tRun = performance.now();
    if (_inputMode === 'image') {
      await processOnce();
      _m.cpu.firstFrame = performance.now() - tRun;
      _m.accel.firstFrame = performance.now() - tRun;
      updateMetrics();
      sS('Done (single frame). Switch to Video/Camera for live FPS.', 'success');
    } else {
      _running = true;
      loop();
      sS('Running live…', 'info');
    }
  } catch (e) {
    sS('Error: ' + e.message, 'error');
    console.error(e);
  } finally {
    $('runBtn').disabled = false;
  }
}

function stop() {
  _running = false;
  if (_rafId) cancelAnimationFrame(_rafId);
  var cam = $('sourceCamera');
  if (cam.srcObject) { cam.srcObject.getTracks().forEach(function(t){t.stop();}); cam.srcObject = null; }
  var vid = $('sourceVideo'); vid.pause();
}

// ---- isolated benchmark ----
async function runBenchSide(side, seconds) {
  _m[side] = _newMetrics();
  _jank[side] = 0;
  _cpuSamples = [];
  _collectCpu = true;
  var frame = getFrameCanvas();
  var blur = parseInt($('blurSlider').value, 10);
  var start = performance.now();
  while (performance.now() - start < seconds * 1000) {
    if (side === 'cpu') { var r = await inferCpu(frame); renderBlur($('canvasWasm'), frame, r.mask, blur); }
    else { r = await inferWebnn(frame); renderBlur($('canvasWebnn'), frame, r.mask, blur); }
    recordMetrics(side, r.totalMs, r.blockMs);
  }
  _collectCpu = false;
  _cpuLoadsAvg[side] = avg(_cpuSamples);
  var elapsed = (performance.now() - start) / 1000;
  return {
    frames: _m[side].times.length,
    fps: _m[side].times.length / elapsed,
    avg: avg(_m[side].times),
    median: median(_m[side].times),
    p90: percentile(_m[side].times, 0.9),
    p99: percentile(_m[side].times, 0.99),
    blockAvg: avg(_m[side].block),
    cpu: avg(_cpuSamples)
  };
}

var _cpuLoadsAvg = { cpu: null, accel: null };

async function benchmark() {
  $('benchBtn').disabled = true;
  var seconds = parseInt($('benchSelect').value, 10);
  var label = seconds >= 30 ? 'Battery' : 'Quick';
  sS('Benchmarking (' + label + ', ' + seconds + 's per side, isolated)…', 'info');
  try {
    if (!modelsReady()) await loadModels();
    await prepareSource();

    var batStart = batteryLevel();
    var a = await runBenchSide('cpu', seconds);
    var batMid = batteryLevel();
    var b = await runBenchSide('accel', seconds);
    var batEnd = batteryLevel();

    // battery drain (%/min) per side
    var drainCpu = (batStart !== null && batMid !== null) ? (batStart - batMid) * 100 * 60 / seconds : null;
    var drainAccel = (batMid !== null && batEnd !== null) ? (batMid - batEnd) * 100 * 60 / seconds : null;

    var dev = $('deviceSelect').value.toUpperCase();
    var cpuName = useWasm() ? 'WASM (CPU)' : 'WebNN CPU';
    $('benchCard').style.display = '';

    var rows = '';
    rows += '<tr><th></th><th>' + cpuName + '</th><th>WebNN ' + dev + '</th></tr>';
    rows += '<tr><td>Frames</td><td>' + a.frames + '</td><td>' + b.frames + '</td></tr>';
    rows += '<tr><td>FPS</td><td>' + a.fps.toFixed(1) + '</td><td>' + b.fps.toFixed(1) + '</td></tr>';
    rows += '<tr><td>Avg ms/frame</td><td>' + a.avg.toFixed(2) + '</td><td>' + b.avg.toFixed(2) + '</td></tr>';
    rows += '<tr><td>Median ms/frame</td><td>' + a.median.toFixed(2) + '</td><td>' + b.median.toFixed(2) + '</td></tr>';
    rows += '<tr><td>p90 / p99 (ms)</td><td>' + a.p90.toFixed(2) + ' / ' + a.p99.toFixed(2) + '</td><td>' + b.p90.toFixed(2) + ' / ' + b.p99.toFixed(2) + '</td></tr>';
    rows += '<tr><td>Main-thread blocked / frame</td><td>' + a.blockAvg.toFixed(2) + ' ms</td><td>' + b.blockAvg.toFixed(2) + ' ms</td></tr>';
    rows += '<tr><td>≈ CPU load</td><td>' + (a.cpu !== null ? a.cpu.toFixed(0) + '%' : '—') + '</td><td>' + (b.cpu !== null ? b.cpu.toFixed(0) + '%' : '—') + '</td></tr>';
    if (drainCpu !== null && drainAccel !== null) {
      rows += '<tr><td>Battery drain</td><td>' + drainCpu.toFixed(3) + ' %/min</td><td>' + drainAccel.toFixed(3) + ' %/min</td></tr>';
      rows += '<tr><td>Energy / frame (drain ÷ frames)</td><td>' + (drainCpu / Math.max(1,a.frames)).toExponential(2) + '</td><td>' + (drainAccel / Math.max(1,b.frames)).toExponential(2) + '</td></tr>';
    } else {
      rows += '<tr><td>Battery drain</td><td colspan="2">n/a (no getBattery or charging)</td></tr>';
    }
    $('benchTable').innerHTML = rows;

    renderVerdict(a, b, drainCpu, drainAccel, cpuName, dev);
    sS('Benchmark complete.', 'success');
  } catch (e) {
    sS('Benchmark error: ' + e.message, 'error');
    console.error(e);
  } finally {
    $('benchBtn').disabled = false;
  }
}

function renderVerdict(a, b, drainCpu, drainAccel, cpuName, dev) {
  var v = $('verdict');
  var speedup = b.fps / Math.max(0.001, a.fps);
  var cpuReduction = (a.blockAvg > 0) ? (1 - b.blockAvg / a.blockAvg) * 100 : 0;
  var batteryReduction = (drainCpu !== null && drainCpu > 0) ? (1 - drainAccel / drainCpu) * 100 : null;

  var winnerIsAccel = speedup >= 1;
  v.style.display = '';
  v.className = winnerIsAccel ? 'win-npu' : 'win-cpu';

  var lines = [];
  var winner = winnerIsAccel ? 'WebNN ' + dev : cpuName;
  lines.push('<span class="big">' + winner + ' wins</span>');
  lines.push(speedup >= 1
    ? '— <b>' + speedup.toFixed(1) + '× faster</b> (FPS)'
    : '— <b>' + (1/speedup).toFixed(1) + '× slower</b> (FPS)');
  lines.push('— <b>' + Math.max(0, cpuReduction).toFixed(0) + '% less main-thread blocking</b>');
  if (batteryReduction !== null && drainCpu !== null && drainCpu > 0) {
    lines.push('— <b>' + Math.max(0, batteryReduction).toFixed(0) + '% less battery drain</b>');
  }
  v.innerHTML = lines.join('<br>');
}

// ---- init ----
window.addEventListener('load', function () {
  if (!hasGetUserMedia()) {
    var camBtn = document.querySelector('#inputGroup .seg-btn[data-value="camera"]');
    if (camBtn) camBtn.style.display = 'none';
  }
  initSegmented('inputGroup', 'inputSelect', function (v) {
    stop();
    _inputMode = v;
    $('runBtn').textContent = v === 'image' ? 'Run' : 'Start';
  });
  initSegmented('deviceGroup', 'deviceSelect', function (v) {
    _webnnModel = null;
    $('webnnTag').textContent = v.toUpperCase();
  });
  initSegmented('benchGroup', 'benchSelect');
  $('blurSlider').addEventListener('input', function () { $('blurVal').textContent = this.value + 'px'; });
  $('useWasmCheck').addEventListener('change', function () {
    $('cpuTag').textContent = this.checked ? 'WASM' : 'WebNN';
    sS('CPU backend: ' + (this.checked ? 'WASM (ONNX Runtime)' : 'WebNN CPU') + '. Click Run.', 'info');
  });
  $('imageInput').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    $('sourceImage').src = URL.createObjectURL(f);
    sS('Image loaded. Click Run.', 'info');
  });
  // long-task jank observer (guard against unsupported entry types)
  if (typeof PerformanceObserver !== 'undefined' && PerformanceObserver.supportedEntryTypes && PerformanceObserver.supportedEntryTypes.indexOf('longtask') !== -1) {
    try {
      _longtaskObserver = new PerformanceObserver(function (list) {
        for (var e of list.getEntries()) {
          if (_running) { _jank.cpu++; _jank.accel++; }
        }
      });
      _longtaskObserver.observe({ entryTypes: ['longtask'] });
    } catch (e) {}
  }
  // battery (Chromium, deprecated)
  if (navigator.getBattery) {
    navigator.getBattery().then(function (b) { _battery = b; }).catch(function(){});
  }
  startCpuWorker();
  loadModels();
});
</script>
